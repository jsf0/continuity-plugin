name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Compile Python sources
        run: uv run python -m compileall continuity tests scripts

      - name: Run synthetic retrieval demo
        run: ./scripts/demo-retrieval.sh --quiet

      - name: Run small-model context demo
        run: uv run python scripts/demo-small-model-context.py

      - name: Run isolated plugin smoke test
        run: ./scripts/smoke-test.sh

      - name: Build package
        run: uv build

      - name: Verify wheel contents
        run: |
          uv run python - <<'PY'
          import glob
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          assert wheels, "no wheel produced"
          wheel = wheels[-1]
          print(wheel)
          with zipfile.ZipFile(wheel) as z:
              names = set(z.namelist())
          for required in ["continuity/plugin.yaml", "continuity/py.typed"]:
              assert required in names, f"missing {required}"
              print(required, "OK")
          PY
