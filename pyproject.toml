[project]
name = "hermes-continuity-memory"
version = "0.1.0"
description = "Local-first structured continuity memory provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joseph" }]
keywords = ["hermes-agent", "memory", "rag", "sqlite", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.7",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuity"]

[tool.hatch.build.targets.wheel.force-include]
"continuity/plugin.yaml" = "continuity/plugin.yaml"
"continuity/py.typed" = "continuity/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "A", "C4", "PTH", "RET"]
ignore = ["E501", "A002"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
